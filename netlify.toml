[build]
  command = "pnpm run build"
  publish = "artifacts/school-platform/dist/public"

[build.environment]
  NODE_VERSION = "22"

# Serve the React application for direct visits to client-side routes.
# Netlify serves existing files/assets normally and falls back to index.html for app routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Keep the app shell and service worker fresh so clients receive security fixes.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
