name: RESA database migration replay

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/resa-database-migration-replay.yml"

permissions:
  contents: read

concurrency:
  group: resa-db-replay-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  replay:
    name: Replay all Supabase migrations in an isolated local stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.58.5

      - name: Start disposable local Supabase stack
        run: supabase start

      - name: Replay every migration against the disposable database
        run: supabase db reset --local

      - name: Confirm migration history is fully applied
        run: supabase migration list --local

      - name: Stop disposable local Supabase stack
        if: always()
        run: supabase stop --no-backup
