name: RESA portal checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resa-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    env:
      PORT: 5000
      BASE_PATH: /
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Build production applications
        run: pnpm run build

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8

      - name: Typecheck RESA Edge Functions
        run: >-
          deno check --node-modules-dir=auto
          supabase/functions/resa-activate-account/index.ts
          supabase/functions/resa-external-candidate-register/index.ts
          supabase/functions/resa-external-cbt/index.ts
          supabase/functions/resa-admission-application-submit/index.ts
          supabase/functions/resa-push-dispatch/index.ts

      - name: Test RESA push audience authorization
        run: deno test --node-modules-dir=auto supabase/functions/resa-push-dispatch/parent-audience_test.ts

      - name: Test RESA notification preference routing
        run: deno test --node-modules-dir=auto supabase/functions/resa-push-dispatch/notification-preferences_test.ts

  detect-migration-changes:
    name: Detect database migration changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      migrations: ${{ steps.changed.outputs.migrations }}
    steps:
      - name: Check out pull request history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changed migration files
        id: changed
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE_REF"...HEAD | grep -q '^supabase/migrations/'; then
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          else
            echo "migrations=false" >> "$GITHUB_OUTPUT"
          fi

  migration-replay:
    name: Replay migrations in disposable Supabase
    needs: detect-migration-changes
    if: needs.detect-migration-changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.58.5
      - name: Start disposable local Supabase stack
        run: supabase start
      - name: Replay every migration against the disposable database
        run: supabase db reset --local
      - name: Confirm migration history is fully applied
        run: supabase migration list --local
      - name: Stop disposable local Supabase stack
        if: always()
        run: supabase stop --no-backup
