name: RESA portal checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resa-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    env:
      PORT: 5000
      BASE_PATH: /
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Build production applications
        run: pnpm run build

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8

      - name: Typecheck RESA Edge Functions
        run: >-
          deno check --node-modules-dir=auto
          supabase/functions/resa-activate-account/index.ts
          supabase/functions/resa-external-candidate-register/index.ts
          supabase/functions/resa-external-cbt/index.ts
          supabase/functions/resa-admission-application-submit/index.ts
          supabase/functions/resa-push-dispatch/index.ts

      - name: Test RESA push audience authorization
        run: deno test --node-modules-dir=auto supabase/functions/resa-push-dispatch/parent-audience_test.ts

      - name: Test RESA notification preference routing
        run: deno test --node-modules-dir=auto supabase/functions/resa-push-dispatch/notification-preferences_test.ts

  detect-migration-changes:
    name: Detect database migration changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      migrations: ${{ steps.changed.outputs.migrations }}
    steps:
      - name: Check out pull request history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changed migration files
        id: changed
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE_REF"...HEAD | grep -q '^supabase/migrations/'; then
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          else
            echo "migrations=false" >> "$GITHUB_OUTPUT"
          fi

  migration-replay:
    name: Validate pending grading and CBT migrations
    needs: detect-migration-changes
    if: needs.detect-migration-changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Wait for disposable PostgreSQL
        run: |
          for attempt in {1..30}; do
            if pg_isready; then exit 0; fi
            sleep 2
          done
          echo "PostgreSQL did not become ready" >&2
          exit 1
      - name: Create synthetic RESA schema baseline
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/resa-grading-baseline.sql
      - name: Apply CAT 1 and CAT 2 migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261120140000_add_cat1_cat2_scores.sql
      - name: Apply versioned grading configuration migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261120150000_versioned_grading_configuration.sql
      - name: Apply configured CBT transfer migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261120160000_cbt_transfer_uses_configured_exam_max.sql
      - name: Run grading, legacy preservation and CBT regression tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/resa-grading-migrations-test.sql
