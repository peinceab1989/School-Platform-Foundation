<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14532d">
<title>RESA · Connection unavailable</title>
<style>
:root{color-scheme:light;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8fafc;color:#0f172a;padding:24px}
main{width:min(100%,440px);background:white;border:1px solid #e2e8f0;border-radius:24px;padding:32px;text-align:center;box-shadow:0 16px 48px #0f172a12}
img{width:76px;height:76px;margin:0 auto 18px}h1{font-size:24px;margin:0 0 12px;color:#14532d}p{line-height:1.65;color:#475569;margin:0 0 20px}
button{border:0;border-radius:10px;background:#14532d;color:white;font-weight:700;padding:12px 20px;font-size:15px;cursor:pointer}
small{display:block;margin-top:18px;color:#64748b;line-height:1.5}
</style>
</head>
<body><main>
<img src="/icons/resa-app-192.svg" alt="RESA">
<h1>You’re currently offline</h1>
<p>RESA needs an internet connection to securely load your school portal. Your private school records are not stored on this device for offline access.</p>
<button type="button" onclick="location.reload()">Try again</button>
<small>When your connection returns, reopen RESA and sign in normally.</small>
</main></body></html>
